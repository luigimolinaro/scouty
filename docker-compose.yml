services:
  scout:
    build: .
    image: scout-pallavolo:latest
    restart: unless-stopped
    env_file: .env
    user: "${DATA_UID:-1000}:${DATA_GID:-1000}"
    volumes:
      - ./data:/data
    ports:
      - "8080:8080"

  # HTTPS automatico con Let's Encrypt (avvio: docker compose --profile https up -d)
  caddy:
    image: caddy:2-alpine
    profiles: ["https"]
    restart: unless-stopped
    env_file: .env
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - scout

volumes:
  caddy_data:
  caddy_config:
